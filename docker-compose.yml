services:
  stagelink-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: stagelink-ui:latest
    container_name: stagelink-ui
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
