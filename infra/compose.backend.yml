name: stagelink-backend
x-node: &node
  image: stagelink-backend:foundation
  build:
    context: ..
    dockerfile: backend/Dockerfile
  init: true
  environment: &node-env
    NODE_ENV: development
    DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?connect_timeout=3&pool_timeout=3
    REDIS_URL: redis://redis:6379
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.12-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *node
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *node
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    <<: *node
    command: ["node", "dist/worker/src/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai:
    image: stagelink-ai:foundation
    build: { context: ../backend/ai }
    init: true
    # Internal-only service, no browser access or public port.
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    profiles: ["web"]
    build: { context: .., dockerfile: Dockerfile }
    ports: ["127.0.0.1:3000:80"]
volumes:
  postgres-data:
  redis-data:
