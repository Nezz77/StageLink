# Dedicated integration services. Separate project, no persistent volumes.
name: stagelink-backend-test
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: stagelink
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: stagelink_test
    ports: ['127.0.0.1:55433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stagelink -d stagelink_test']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.12-bookworm
    ports: ['127.0.0.1:56380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
